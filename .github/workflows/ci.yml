name: Notícia Certa Bot - Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar Testes Unitários e de Integração
        env:
          TELEGRAM_BOT_TOKEN: "dummy_token_para_passar_nos_testes:12345"
        run: ./mvnw clean verify -B

      - name: Construir Imagem Docker (Sanity Check)
        run: docker build -t noticia-certa-bot:latest .